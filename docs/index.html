<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protein of the Day</title>
  <meta name="description" content="A famous protein, chosen for every calendar day. Structures courtesy of the RCSB Protein Data Bank.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🧬</span>
      <span class="brand-text">Protein of the Day</span>
    </div>
    <nav class="date-nav" aria-label="Choose a date">
      <button id="prev" type="button" class="nav-btn" title="Previous day" aria-label="Previous day">‹</button>
      <input id="date-picker" type="date" class="date-picker" aria-label="Pick a date">
      <button id="next" type="button" class="nav-btn" title="Next day" aria-label="Next day">›</button>
      <button id="today" type="button" class="nav-btn text-btn">Today</button>
    </nav>
  </header>

  <main id="app" class="app">
    <p id="status" class="status" role="status">Loading today's protein…</p>
  </main>

  <footer class="site-footer">
    <p>
      Structure images and data from the
      <a href="https://www.rcsb.org" rel="noopener">RCSB Protein Data Bank</a>.
      One protein for every day — the same one for everyone.
    </p>
    <p class="footer-sub">An open-source project. The same rotation is available as a command-line tool.</p>
  </footer>

  <template id="card-template">
    <article class="card">
      <div class="card-media">
        <img class="card-image" alt="" loading="lazy">
        <div class="card-image-fallback" hidden aria-hidden="true">🧬</div>
      </div>
      <div class="card-body">
        <p class="card-date"></p>
        <h1 class="card-name"></h1>
        <p class="card-tagline"></p>
        <dl class="card-meta"></dl>
        <p class="card-description"></p>
        <p class="card-fun-fact"></p>
        <p class="card-links">
          <a class="link-rcsb" target="_blank" rel="noopener">View on RCSB PDB ↗</a>
          <a class="link-3d" target="_blank" rel="noopener">Explore in 3-D ↗</a>
        </p>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
