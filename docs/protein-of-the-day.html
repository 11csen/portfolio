<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Protein of the Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.5.3/3Dmol-min.js"></script>
<style>
  :root{
    --bg0:#05060a;
    --bg1:#0b0f19;
    --ink:#e9edf6;
    --muted:#8b95ab;
    --faint:#565f78;
    --line:rgba(255,255,255,0.09);
    --accent:#5fe6df;
    --violet:#5b5fe0;
    --sans:'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono:'Space Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --pad:clamp(20px, 4vw, 44px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg0);
    color:var(--ink);
    font-family:var(--sans);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  #stage{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 42%, var(--bg1) 0%, var(--bg0) 60%, #030407 100%);
  }

  /* cool atmosphere behind the specimen */
  #glow{
    position:absolute;
    left:50%; top:44%;
    width:min(78vw, 78vh); height:min(78vw, 78vh);
    transform:translate(-50%,-50%);
    background:
      radial-gradient(circle at 50% 50%,
        rgba(95,230,223,0.13) 0%,
        rgba(91,95,224,0.10) 28%,
        rgba(91,95,224,0.03) 46%,
        transparent 66%);
    filter:blur(6px);
    pointer-events:none;
    z-index:1;
  }

  #viewer{
    position:absolute;
    inset:0;
    z-index:2;
    opacity:0;
    transition:opacity 1.2s ease;
  }
  #viewer.ready{ opacity:1; }
  #viewer canvas{ outline:none !important; }

  /* edge vignette to focus the eye, kept faint so it never dims the specimen */
  #vignette{
    position:absolute; inset:0; z-index:3; pointer-events:none;
    background:radial-gradient(130% 100% at 50% 46%, transparent 52%, rgba(3,4,7,0.55) 100%);
  }
  /* scrims so the type stays legible over the molecule */
  #scrim-top{
    position:absolute; left:0; right:0; top:0; height:130px; z-index:4; pointer-events:none;
    background:linear-gradient(180deg, rgba(5,6,10,0.85) 0%, transparent 100%);
  }
  #scrim-bottom{
    position:absolute; left:0; right:0; bottom:0; height:46%; z-index:4; pointer-events:none;
    background:linear-gradient(0deg, rgba(4,5,9,0.94) 6%, rgba(4,5,9,0.6) 42%, transparent 100%);
  }

  /* ---- eyebrow ---- */
  #eyebrow{
    position:absolute; z-index:6;
    top:var(--pad); left:var(--pad); right:var(--pad);
    display:flex; justify-content:space-between; align-items:baseline; gap:16px;
    font-family:var(--mono); font-size:11px; letter-spacing:0.26em; text-transform:uppercase;
  }
  #eyebrow .tag{ color:var(--muted); display:flex; align-items:center; gap:10px; }
  #eyebrow .tag::before{
    content:""; width:6px; height:6px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 10px var(--accent);
    display:inline-block; transform:translateY(-1px);
  }
  #eyebrow .date{ color:var(--faint); letter-spacing:0.22em; white-space:nowrap; }

  /* ---- info block ---- */
  #info{
    position:absolute; z-index:6;
    left:var(--pad); bottom:var(--pad);
    max-width:min(52ch, 78vw);
    display:flex; flex-direction:column; gap:14px;
  }
  .legend{ display:flex; flex-direction:column; gap:6px; width:132px; }
  .legend .bar{
    height:4px; border-radius:3px;
    background:linear-gradient(90deg, #3a2f7a 0%, #2f6be0 52%, #5fe6df 100%);
  }
  .legend .ends{
    display:flex; justify-content:space-between;
    font-family:var(--mono); font-size:9px; letter-spacing:0.2em; color:var(--faint); text-transform:uppercase;
  }
  .legend .cap{
    font-family:var(--mono); font-size:9px; letter-spacing:0.24em; color:var(--faint); text-transform:uppercase;
  }

  #pname{
    font-weight:500;
    font-size:clamp(1.9rem, 4.6vw, 3.5rem);
    line-height:1.0;
    letter-spacing:-0.02em;
    color:var(--ink);
  }
  #pdesc{
    font-weight:400;
    font-size:clamp(0.98rem, 1.5vw, 1.16rem);
    line-height:1.5;
    color:var(--muted);
    max-width:46ch;
  }
  #chips{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--muted);
  }
  #chips .sep{ color:var(--faint); }
  #source{
    font-family:var(--mono); font-size:10px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--faint); padding-top:2px;
  }
  #source a{ color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:1px; }
  #source a:hover{ color:var(--accent); border-color:var(--accent); }
  #source .flag{ color:var(--accent); }

  /* ---- controls ---- */
  #controls{
    position:absolute; z-index:6;
    right:var(--pad); bottom:var(--pad);
    display:flex; gap:8px; align-items:center;
  }
  #controls button{
    appearance:none; background:transparent; cursor:pointer;
    border:1px solid var(--line); border-radius:999px;
    color:var(--muted);
    font-family:var(--mono); font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase;
    padding:9px 14px;
    display:flex; align-items:center; gap:8px;
    transition:color .2s ease, border-color .2s ease, background .2s ease;
  }
  #controls button:hover{ color:var(--ink); border-color:rgba(255,255,255,0.22); }
  #controls button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  #controls .dot{
    width:6px; height:6px; border-radius:50%; background:var(--faint); transition:.2s ease;
  }
  #controls button.on .dot{ background:var(--accent); box-shadow:0 0 8px var(--accent); }

  /* ---- status / loading ---- */
  #status{
    position:absolute; z-index:7; left:50%; top:50%;
    transform:translate(-50%,-50%);
    font-family:var(--mono); font-size:11px; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--muted);
    display:flex; align-items:center; gap:12px;
    transition:opacity .5s ease;
  }
  #status .pulse{
    width:7px; height:7px; border-radius:50%; background:var(--accent);
    animation:pulse 1.4s ease-in-out infinite;
  }
  #status.hidden{ opacity:0; pointer-events:none; }
  #status.error .pulse{ background:#e0685f; animation:none; }
  @keyframes pulse{
    0%,100%{ opacity:.25; transform:scale(0.8); }
    50%{ opacity:1; transform:scale(1.15); }
  }

  /* entrance */
  .rise{ opacity:0; transform:translateY(14px); }
  body.in .rise{ opacity:1; transform:none; transition:opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1); }
  body.in #eyebrow.rise{ transition-delay:.05s; }
  body.in #info.rise{ transition-delay:.18s; }
  body.in #controls.rise{ transition-delay:.30s; }

  @media (max-width:640px){
    :root{ --pad:18px; }
    #controls{ top:calc(var(--pad) + 26px); bottom:auto; right:var(--pad); }
    #info{ max-width:none; right:var(--pad); gap:11px; }
    #pdesc{ max-width:none; font-size:0.98rem; }
    #pname{ font-size:clamp(1.6rem, 7vw, 2.4rem); }
    #eyebrow{ font-size:10px; letter-spacing:0.18em; }
  }
  /* short viewports: the embedded 16:9 frame on a phone, or a phone in landscape */
  @media (max-height:460px){
    #pdesc{ display:none; }
    #chips{ display:none; }
    #pname{ font-size:clamp(1.25rem, 6vw, 1.9rem); }
    .legend{ width:104px; }
    #eyebrow{ top:14px; left:14px; right:14px; }
    #info{ bottom:14px; left:14px; gap:8px; }
    #controls{ top:12px; bottom:auto; right:14px; }
    #scrim-bottom{ height:60%; }
  }

  @media (prefers-reduced-motion: reduce){
    #viewer{ transition:none; }
    .rise{ opacity:1; transform:none; }
    body.in .rise{ transition:none; }
    #status .pulse{ animation:none; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="glow"></div>
    <div id="viewer" role="img" aria-label="Rotating 3D structure of the day's protein"></div>
    <div id="vignette"></div>
    <div id="scrim-top"></div>
    <div id="scrim-bottom"></div>

    <header id="eyebrow" class="rise">
      <span class="tag">Protein of the day</span>
      <span class="date" id="date">—</span>
    </header>

    <div id="status"><span class="pulse"></span><span id="status-text">Resolving today’s structure</span></div>

    <section id="info" class="rise" aria-live="polite">
      <div class="legend">
        <span class="cap" id="legend-cap">Model confidence</span>
        <span class="bar"></span>
        <span class="ends"><span id="legend-lo">Low</span><span id="legend-hi">High</span></span>
      </div>
      <h1 id="pname">—</h1>
      <p id="pdesc">—</p>
      <div id="chips"></div>
      <div id="source"></div>
    </section>

    <div id="controls" class="rise">
      <button id="btnSpin" class="on" aria-label="Toggle rotation"><span class="dot"></span>Rotate</button>
      <button id="btnStyle" aria-label="Toggle representation">Ribbon</button>
    </div>
  </div>

  var FALLBACK = {
    name:"Crambin",
    org:"Abyssinian cabbage",
    desc:"A small, sturdy plant-seed protein — a classic test structure, shown here while the live database is out of reach.",
    pdb:"1CRN"
  };

  // ---------- date -> deterministic pick (shared by everyone, changes at 00:00 UTC) ----------
  var MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  var now = new Date();
  var Y = now.getUTCFullYear(), M = now.getUTCMonth(), D = now.getUTCDate();
  var key = Y + "-" + String(M+1).padStart(2,"0") + "-" + String(D).padStart(2,"0");

  function fnv1a(s){
    var h = 0x811c9dc5;
    for (var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return h >>> 0;
  }
  var today = PROTEINS[ fnv1a(key) % PROTEINS.length ];

  document.getElementById("date").textContent =
    String(D).padStart(2,"0") + " " + MON[M] + " " + Y;

  // ---------- dom + state ----------
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var viewerEl = document.getElementById("viewer");
  var statusEl = document.getElementById("status");
  var statusText = document.getElementById("status-text");
  var viewer = null, currentColorer = null, styleMode = "ribbon", spinning = !reduce;

  function setStatus(msg, isError){
    statusText.textContent = msg;
    statusEl.classList.remove("hidden");
    statusEl.classList.toggle("error", !!isError);
  }
  function hideStatus(){ statusEl.classList.add("hidden"); }

  // cohesive cool ramp: dim indigo (low) -> blue -> bright cyan (high)
  var A=[58,47,122], B=[47,107,224], C=[95,230,223];
  function mix(a,b,t){ return a + (b-a)*t; }
  function ramp(t){
    t = t<0?0:(t>1?1:t);
    var r,g,b;
    if (t < 0.5){ var u=t/0.5; r=mix(A[0],B[0],u); g=mix(A[1],B[1],u); b=mix(A[2],B[2],u); }
    else { var v=(t-0.5)/0.5; r=mix(B[0],C[0],v); g=mix(B[1],C[1],v); b=mix(B[2],C[2],v); }
    return (Math.round(r)<<16) | (Math.round(g)<<8) | Math.round(b);
  }
  function makeColorer(mode, stats){
    if (mode === "plddt"){
      var lo=50, hi=90;
      return function(atom){ return ramp((atom.b - lo)/(hi - lo)); };
    }
    var a = stats.minResi, span = (stats.maxResi - stats.minResi) || 1;
    return function(atom){ return ramp((atom.resi - a)/span); };
  }

  function renderStructure(text, format, mode){
    viewer.removeAllModels();
    viewer.removeAllSurfaces();
    viewer.removeAllShapes();

    var model = viewer.addModel(text, format);
    var ca = model.selectedAtoms({ atom:"CA" });
    var minResi=Infinity, maxResi=-Infinity, sumB=0;
    for (var i=0;i<ca.length;i++){
      var r = ca[i].resi;
      if (r<minResi) minResi=r;
      if (r>maxResi) maxResi=r;
      sumB += ca[i].b;
    }
    var meanB = ca.length ? sumB/ca.length : 0;

    currentColorer = makeColorer(mode, { minResi:minResi, maxResi:maxResi });
    viewer.setStyle({}, { cartoon:{ colorfunc: currentColorer, arrows:true } });
    styleMode = "ribbon";
    document.getElementById("btnStyle").textContent = "Ribbon";

    viewer.zoomTo();
    viewer.zoom(1.12);
    viewer.render();
    if (spinning) viewer.spin("y", 0.55);

    return { residues: ca.length, meanB: meanB };
  }

  function esc(s){ return String(s); }

  function fillInfo(o){
    document.getElementById("pname").textContent = o.name;
    document.getElementById("pdesc").textContent = o.desc;

    var chips = document.getElementById("chips");
    var parts = [ esc(o.org), o.residues + " residues", o.metric ];
    chips.innerHTML = parts.map(function(p){ return "<span>"+p+"</span>"; })
                           .join('<span class="sep">·</span>');

    document.getElementById("legend-cap").textContent = o.legendCap;
    document.getElementById("legend-lo").textContent = o.legendLo;
    document.getElementById("legend-hi").textContent = o.legendHi;
    document.getElementById("source").innerHTML = o.source;
    viewerEl.setAttribute("aria-label", o.name + " — 3D structure");
  }

  function showPredicted(entry, stats){
    fillInfo({
      name: entry.name,
      desc: entry.desc,
      org: entry.org,
      residues: stats.residues,
      metric: "pLDDT " + Math.round(stats.meanB),
      legendCap: "Model confidence",
      legendLo: "Low",
      legendHi: "High",
      source: 'Predicted structure · AlphaFold DB · '
            + '<a href="https://alphafold.ebi.ac.uk/entry/'+entry.acc+'" target="_blank" rel="noopener">UniProt '+entry.acc+'</a>'
    });
  }

  function showFallback(stats){
    fillInfo({
      name: FALLBACK.name,
      desc: FALLBACK.desc,
      org: FALLBACK.org,
      residues: stats.residues,
      metric: "X-ray structure",
      legendCap: "Chain",
      legendLo: "N",
      legendHi: "C",
      source: 'Experimental · <a href="https://www.rcsb.org/structure/1CRN" target="_blank" rel="noopener">PDB '+FALLBACK.pdb+'</a>'
            + ' · <span class="flag">offline sample</span>'
    });
  }

  // ---------- surface toggle ----------
  var btnStyle = document.getElementById("btnStyle");
  btnStyle.addEventListener("click", function(){
    if (!viewer) return;
    if (styleMode === "ribbon"){
      styleMode = "surface";
      btnStyle.textContent = "Surface";
      viewer.setStyle({}, { cartoon:{ colorfunc: currentColorer, arrows:true } });
      setStatus("Generating surface", false);
      Promise.resolve(
        viewer.addSurface($3Dmol.SurfaceType.VDW, { opacity:0.72, color:0x5fe6df })
      ).then(function(){ hideStatus(); viewer.render(); })
       .catch(function(){ // revert on any trouble
         styleMode = "ribbon"; btnStyle.textContent = "Ribbon";
         viewer.removeAllSurfaces(); hideStatus(); viewer.render();
       });
    } else {
      styleMode = "ribbon";
      btnStyle.textContent = "Ribbon";
      viewer.removeAllSurfaces();
      viewer.setStyle({}, { cartoon:{ colorfunc: currentColorer, arrows:true } });
      viewer.render();
    }
  });

  // ---------- rotate toggle ----------
  var btnSpin = document.getElementById("btnSpin");
  btnSpin.addEventListener("click", function(){
    if (!viewer) return;
    spinning = !spinning;
    btnSpin.classList.toggle("on", spinning);
    viewer.spin(spinning ? "y" : false, 0.55);
  });
  if (!spinning) btnSpin.classList.remove("on");

  // ---------- load flow ----------
  function loadFallback(){
    var stats = renderStructure(FALLBACK_PDB, "pdb", "spectrum");
    showFallback(stats);
    viewerEl.classList.add("ready");
    hideStatus();
  }

  function boot(){
    // engine present?
    if (typeof $3Dmol === "undefined"){
      setStatus("Couldn’t load the 3D engine — check your connection and reload", true);
      return;
    }
    try{
      viewer = $3Dmol.createViewer(viewerEl, { backgroundAlpha: 0, antialias: true });
    } catch(e){
      setStatus("This browser can’t open a WebGL viewer", true);
      return;
    }

    setStatus("Resolving today’s structure", false);

    // Try the live AlphaFold prediction; fall back to the embedded sample on any failure.
    fetch("https://alphafold.ebi.ac.uk/api/prediction/" + today.acc)
      .then(function(r){ if(!r.ok) throw new Error("api "+r.status); return r.json(); })
      .then(function(data){
        var rec = Array.isArray(data) ? data[0] : data;
        if (!rec) throw new Error("empty");
        var url = rec.pdbUrl || rec.pdbURL;
        var fmt = "pdb";
        if (!url){ url = rec.cifUrl || rec.bcifUrl; fmt = "mmcif"; }
        if (!url) throw new Error("no file url");
        return fetch(url).then(function(pr){
          if(!pr.ok) throw new Error("file "+pr.status);
          return pr.text();
        }).then(function(txt){ return { txt:txt, fmt:fmt }; });
      })
      .then(function(res){
        var stats = renderStructure(res.txt, res.fmt, "plddt");
        showPredicted(today, stats);
        viewerEl.classList.add("ready");
        hideStatus();
      })
      .catch(function(err){
        // Network blocked, protein missing, or parse issue — show the real sample instead.
        try { loadFallback(); }
        catch(e2){ setStatus("Couldn’t render a structure right now", true); }
      });
  }

  // resize handling
  var rz;
  window.addEventListener("resize", function(){
    if (!viewer) return;
    clearTimeout(rz);
    rz = setTimeout(function(){ viewer.resize(); viewer.render(); }, 120);
  });

  // entrance + boot
  window.addEventListener("load", function(){
    requestAnimationFrame(function(){ document.body.classList.add("in"); });
    boot();
  });

})();
</script>
