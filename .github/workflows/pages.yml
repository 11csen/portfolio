name: Deploy web app to GitHub Pages

# Publishes the static site in docs/ to GitHub Pages.
#
# One-time setup: in the repository settings, open Pages and set
# "Build and deployment" > "Source" to "GitHub Actions". After that this
# workflow deploys on every push to the default branch. The site rotates the
# protein of the day on its own, client-side, so no scheduled rebuild is
# needed.

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
